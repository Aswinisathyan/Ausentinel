<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ausentinel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}">Ausentinel</a>
      <nav aria-label="Main">
        <a href="{{ url_for('index') }}" {% if active == 'analyse' %}aria-current="page"{% endif %}>Analyse</a>
        <a href="{{ url_for('results_page') }}" {% if active == 'results' %}aria-current="page"{% endif %}>Results</a>
        <a href="{{ url_for('about_page') }}" {% if active == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap site-footer">
    Experimental research prototype trained on ASVspoof 2019 LA.
    Do not use it as the only basis for security decisions.
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
